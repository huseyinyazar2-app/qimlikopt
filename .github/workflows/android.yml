name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "gateway-v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./android-gateway

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android-gateway/app/build/outputs/apk/debug/app-debug.apk

    # Yalnizca "gateway-v*" etiketi atilinca kalici, indirilebilir bir Release olustur.
    - name: APK'yi yeniden adlandir
      if: startsWith(github.ref, 'refs/tags/gateway-v')
      working-directory: ${{ github.workspace }}
      run: cp android-gateway/app/build/outputs/apk/debug/app-debug.apk qimlik-gateway.apk

    - name: Release olustur
      if: startsWith(github.ref, 'refs/tags/gateway-v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: qimlik Gateway ${{ github.ref_name }}
        files: qimlik-gateway.apk
        body: |
          qimlik reverse-OTP gateway uygulamasi (kisisel kullanim, Play Store'a gitmez).

          Kurulum:
          1. Asagidaki qimlik-gateway.apk dosyasini telefonunuza indirin.
          2. Acmaya calisinca "bilinmeyen kaynaklardan kuruluma izin ver" diyin.
          3. Uygulamayi acip Ayarlar'dan sunucu adresini (https://api.qimlik.com) ve gateway API anahtarinizi girin.
