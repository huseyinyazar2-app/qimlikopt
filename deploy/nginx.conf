# Coolify/Traefik TLS'i sonlandirir; burada yalniz 80 dinlenir.
# api.qimlik.com BU KONTEYNERE GELMEZ — Traefik onu dogrudan API konteynerine yonlendirir.

map $host $qimlik_root {
    default            /usr/share/nginx/html/website;
    admin.qimlik.com   /usr/share/nginx/html/admin;
    panel.qimlik.com   /usr/share/nginx/html/client;
    dijital.qimlik.com /usr/share/nginx/html/dijital;
    mesai.qimlik.com   /usr/share/nginx/html/mesai;
    teslimat.qimlik.com /usr/share/nginx/html/teslimat;
}

server {
    listen 80 default_server;
    server_name _;

    root $qimlik_root;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Konteyner saglik yoklamasi (Coolify) — Host basligindan bagimsiz.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Vite ciktisi icerik ozetli (hash) dosya adlari uretir: uzun sureli onbellek guvenli.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html asla onbellege alinmamali; yoksa eski surum yapisir.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Tek sayfa uygulamasi: bilinmeyen yol index.html'e duser (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
