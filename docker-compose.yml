version: '3.8'

services:
  backend:
    image: node:20-alpine
    container_name: qimlik-backend
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && node server.js"
    networks:
      - coolify
    environment:
      - PORT=3303
      - GATEWAY_API_KEY=8|236Ogs9nZVd34TBewgHndQ3MYsznRR8DNDhVpflFde5fd007
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qimlik-backend.entrypoints=http,https"
      - "traefik.http.routers.qimlik-backend.rule=Host(`api.qimlik.com`)"
      - "traefik.http.routers.qimlik-backend.tls=true"
      - "traefik.http.routers.qimlik-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.qimlik-backend.loadbalancer.server.port=3303"

  frontend:
    image: nginx:alpine
    container_name: qimlik-frontend
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./website:/usr/share/nginx/html/website:ro
      - ./admin:/usr/share/nginx/html/admin:ro
      - ./client:/usr/share/nginx/html/client:ro
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qimlik-frontend.entrypoints=http,https"
      - "traefik.http.routers.qimlik-frontend.rule=Host(`qimlik.com`) || Host(`www.qimlik.com`) || Host(`admin.qimlik.com`) || Host(`panel.qimlik.com`)"
      - "traefik.http.routers.qimlik-frontend.tls=true"
      - "traefik.http.routers.qimlik-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.qimlik-frontend.loadbalancer.server.port=80"

networks:
  coolify:
    external: true
